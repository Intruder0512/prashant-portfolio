# AI Recruiter Worker for prashantyadav.tech
# Secret (set in the Cloudflare dashboard or with `npx wrangler secret put ANTHROPIC_API_KEY`):
#   ANTHROPIC_API_KEY  — Claude API key. Never commit it.
name = "prashant-ai-recruiter"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false

routes = [
  { pattern = "prashantyadav.tech/api/*", zone_name = "prashantyadav.tech" },
  { pattern = "www.prashantyadav.tech/api/*", zone_name = "prashantyadav.tech" },
]

[vars]
MODEL = "claude-haiku-5-5"
ALLOWED_ORIGINS = "https://prashantyadav.tech,https://www.prashantyadav.tech"

# 10 questions per minute per visitor
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[observability]
enabled = true
