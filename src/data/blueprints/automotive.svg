<svg class="bp-svg" viewBox="0 0 980 580" xmlns="http://www.w3.org/2000/svg" font-family="DM Sans,sans-serif" font-size="11">
          <rect x="20" y="20" width="470" height="260" rx="14" fill="rgba(29,78,216,.05)" stroke="#1d4ed8" stroke-width="1.8"/>
          <text x="255" y="42" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">Simulation Stack</text>
          <g class="an" data-tip="CARLA — Open-source autonomous driving simulator with high-fidelity urban environments, weather, and traffic. Python API for scenario scripting. OpenDRIVE maps.">
            <rect x="34" y="62" width="210" height="66" rx="9" fill="#eff4ff" stroke="#1d4ed8" stroke-width="1.3"/>
            <text x="139" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">CARLA Simulator</text>
            <text x="139" y="100" text-anchor="middle" font-size="8" fill="#7b7669">Urban · Weather · Traffic</text>
            <text x="139" y="112" text-anchor="middle" font-size="8" fill="#7b7669">OpenDRIVE maps</text>
            <text x="139" y="124" text-anchor="middle" font-size="8" fill="#7b7669">Python API · Scenario scripting</text>
          </g>
          <g class="an" data-tip="ROS2 — Robot Operating System 2. DDS-based pub/sub for sensor data, control commands, and inter-process communication. Real-time support via RT patches.">
            <rect x="264" y="62" width="210" height="66" rx="9" fill="#eff4ff" stroke="#1d4ed8" stroke-width="1.3"/>
            <text x="369" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">ROS2</text>
            <text x="369" y="100" text-anchor="middle" font-size="8" fill="#7b7669">DDS pub/sub</text>
            <text x="369" y="112" text-anchor="middle" font-size="8" fill="#7b7669">Sensor + control messages</text>
            <text x="369" y="124" text-anchor="middle" font-size="8" fill="#7b7669">Real-time capable</text>
          </g>
          <g class="an" data-tip="ARM Virtual Hardware — Cycle-accurate ARM SoC emulation in the cloud. Runs the exact ECU firmware without physical hardware. Parallel simulation at scale.">
            <rect x="34" y="148" width="210" height="66" rx="9" fill="#eff4ff" stroke="#1d4ed8" stroke-width="1.3"/>
            <text x="139" y="170" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">ARM Virtual Hardware</text>
            <text x="139" y="186" text-anchor="middle" font-size="8" fill="#7b7669">Cycle-accurate SoC</text>
            <text x="139" y="198" text-anchor="middle" font-size="8" fill="#7b7669">Actual ECU firmware</text>
            <text x="139" y="210" text-anchor="middle" font-size="8" fill="#7b7669">Parallel cloud runs</text>
          </g>
          <g class="an" data-tip="Scenario Library — Pre-defined test cases (cut-in, pedestrian, adverse weather, edge cases). Parameterized for fuzzing. Replay driver logs.">
            <rect x="264" y="148" width="210" height="66" rx="9" fill="#eff4ff" stroke="#1d4ed8" stroke-width="1.3"/>
            <text x="369" y="170" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">Scenario Library</text>
            <text x="369" y="186" text-anchor="middle" font-size="8" fill="#7b7669">Test cases · Edge cases</text>
            <text x="369" y="198" text-anchor="middle" font-size="8" fill="#7b7669">Parameterized fuzzing</text>
            <text x="369" y="210" text-anchor="middle" font-size="8" fill="#7b7669">Real-world log replay</text>
          </g>
          <g class="an" data-tip="Sensor Models — LiDAR, camera, radar, IMU, GPS virtual sensors with realistic noise and failure modes. Calibrated against physical hardware.">
            <rect x="34" y="232" width="440" height="40" rx="9" fill="#eff4ff" stroke="#1d4ed8" stroke-width="1.3"/>
            <text x="254" y="250" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1d4ed8">Sensor Models — LiDAR · Camera · Radar · IMU · GPS</text>
            <text x="254" y="264" text-anchor="middle" font-size="8" fill="#7b7669">Realistic noise models · Failure injection · Hardware-calibrated</text>
          </g>
          <rect x="510" y="20" width="450" height="260" rx="14" fill="rgba(22,163,74,.04)" stroke="#16a34a" stroke-width="1.8"/>
          <text x="735" y="42" text-anchor="middle" font-size="11.5" font-weight="700" fill="#16a34a">Compute Orchestration</text>
          <g class="an" data-tip="GPU Cluster — NVIDIA A100/H100 nodes for parallel simulation, LiDAR point-cloud rendering, and ML training. Multi-instance GPU (MIG) for fractional allocation.">
            <rect x="524" y="62" width="210" height="66" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
            <text x="629" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">GPU Cluster</text>
            <text x="629" y="100" text-anchor="middle" font-size="8" fill="#7b7669">A100 / H100</text>
            <text x="629" y="112" text-anchor="middle" font-size="8" fill="#7b7669">MIG partitioning</text>
            <text x="629" y="124" text-anchor="middle" font-size="8" fill="#7b7669">Parallel sim + training</text>
          </g>
          <g class="an" data-tip="EKS Job Orchestrator — Kubernetes Jobs / Argo Workflows schedule thousands of simulation runs in parallel. Priority queues for regression vs nightly.">
            <rect x="754" y="62" width="190" height="66" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
            <text x="849" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">EKS Orchestrator</text>
            <text x="849" y="100" text-anchor="middle" font-size="8" fill="#7b7669">K8s Jobs + Argo WF</text>
            <text x="849" y="112" text-anchor="middle" font-size="8" fill="#7b7669">Parallel runs</text>
            <text x="849" y="124" text-anchor="middle" font-size="8" fill="#7b7669">Priority queues</text>
          </g>
          <g class="an" data-tip="HIL Test Bench — Hardware-in-the-Loop rigs with real ECUs connected to simulated sensors and actuators. Bridges virtual and physical validation.">
            <rect x="524" y="148" width="210" height="66" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
            <text x="629" y="170" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">HIL Test Bench</text>
            <text x="629" y="186" text-anchor="middle" font-size="8" fill="#7b7669">Hardware-in-Loop</text>
            <text x="629" y="198" text-anchor="middle" font-size="8" fill="#7b7669">Real ECUs · Virtual sensors</text>
            <text x="629" y="210" text-anchor="middle" font-size="8" fill="#7b7669">Bridge virtual + physical</text>
          </g>
          <g class="an" data-tip="Spot / Preemptible Pool — Cost-optimized compute for non-critical simulation batches. Auto-resume on interruption. Up to 70% cost reduction.">
            <rect x="754" y="148" width="190" height="66" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
            <text x="849" y="170" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">Spot Pool</text>
            <text x="849" y="186" text-anchor="middle" font-size="8" fill="#7b7669">Preemptible GPU</text>
            <text x="849" y="198" text-anchor="middle" font-size="8" fill="#7b7669">Auto-resume</text>
            <text x="849" y="210" text-anchor="middle" font-size="8" fill="#7b7669">70% cost reduction</text>
          </g>
          <g class="an" data-tip="Data Pipeline — S3 object store for drive logs, simulation artifacts, sensor recordings. Parquet format. Partitioned by vehicle_id / date / scenario.">
            <rect x="524" y="232" width="420" height="40" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
            <text x="734" y="250" text-anchor="middle" font-size="9.5" font-weight="700" fill="#16a34a">Data Pipeline — S3 · Parquet · Partitioned</text>
            <text x="734" y="264" text-anchor="middle" font-size="8" fill="#7b7669">Drive logs · Simulation artifacts · Sensor recordings</text>
          </g>
          <rect x="20" y="298" width="470" height="160" rx="14" fill="rgba(220,38,38,.04)" stroke="#dc2626" stroke-width="1.8"/>
          <text x="255" y="320" text-anchor="middle" font-size="11.5" font-weight="700" fill="#dc2626">Safety &amp; Validation</text>
          <g class="an" data-tip="ISO 26262 — Functional safety standard for automotive E/E systems. ASIL classification (A-D). Safety cases traced from hazards through requirements to verification.">
            <rect x="34" y="340" width="210" height="56" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
            <text x="139" y="360" text-anchor="middle" font-size="9.5" font-weight="700" fill="#dc2626">ISO 26262 Safety</text>
            <text x="139" y="374" text-anchor="middle" font-size="8" fill="#7b7669">ASIL A-D classification</text>
            <text x="139" y="386" text-anchor="middle" font-size="8" fill="#7b7669">Hazard to req to test trace</text>
          </g>
          <g class="an" data-tip="SOTIF (ISO 21448) — Safety Of The Intended Functionality. Addresses performance limitations of sensors and AI. Validates edge-case coverage.">
            <rect x="264" y="340" width="210" height="56" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
            <text x="369" y="360" text-anchor="middle" font-size="9.5" font-weight="700" fill="#dc2626">SOTIF (ISO 21448)</text>
            <text x="369" y="374" text-anchor="middle" font-size="8" fill="#7b7669">AI / sensor limits</text>
            <text x="369" y="386" text-anchor="middle" font-size="8" fill="#7b7669">Edge-case coverage</text>
          </g>
          <g class="an" data-tip="Safety Validator — Automated gate evaluating simulation results against safety requirements. Blocks promotion if collision rate / TTC violations exceed thresholds.">
            <rect x="34" y="408" width="440" height="40" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
            <text x="254" y="426" text-anchor="middle" font-size="9.5" font-weight="700" fill="#dc2626">Automated Safety Validator (block-on-fail)</text>
            <text x="254" y="440" text-anchor="middle" font-size="8" fill="#7b7669">Collision rate · TTC · Lane-keep · Pedestrian detection SLAs</text>
          </g>
          <rect x="510" y="298" width="450" height="160" rx="14" fill="rgba(109,40,217,.04)" stroke="#6d28d9" stroke-width="1.8"/>
          <text x="735" y="320" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">Continuous ML Training</text>
          <g class="an" data-tip="SageMaker Training — Distributed training of perception models (object detection, segmentation). Data from drive logs + simulation. Nightly training runs.">
            <rect x="524" y="340" width="210" height="56" rx="9" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.3"/>
            <text x="629" y="360" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">SageMaker Training</text>
            <text x="629" y="374" text-anchor="middle" font-size="8" fill="#7b7669">Perception models</text>
            <text x="629" y="386" text-anchor="middle" font-size="8" fill="#7b7669">Distributed · Nightly</text>
          </g>
          <g class="an" data-tip="Model Registry — Versioned perception/planning models with lineage. Approval workflow before deployment. Shadow-mode validation.">
            <rect x="754" y="340" width="190" height="56" rx="9" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.3"/>
            <text x="849" y="360" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">Model Registry</text>
            <text x="849" y="374" text-anchor="middle" font-size="8" fill="#7b7669">Versioned · Lineage</text>
            <text x="849" y="386" text-anchor="middle" font-size="8" fill="#7b7669">Shadow-mode</text>
          </g>
          <g class="an" data-tip="OTA Deployment — Over-the-air updates to vehicle fleet. Staged rollout (beta fleet to 1% to 10% to 100%). Rollback on telemetry regressions.">
            <rect x="524" y="408" width="420" height="40" rx="9" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.3"/>
            <text x="734" y="426" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">OTA Fleet Deployment</text>
            <text x="734" y="440" text-anchor="middle" font-size="8" fill="#7b7669">Beta to 1% to 10% to 100% · Telemetry-based auto-rollback</text>
          </g>
          <rect x="20" y="476" width="940" height="78" rx="14" fill="rgba(8,145,178,.04)" stroke="#0891b2" stroke-width="1.5"/>
          <text x="490" y="496" text-anchor="middle" font-size="11" font-weight="700" fill="#0891b2">Feedback Loop — Fleet Telemetry to Drive Log Replay to New Scenarios</text>
          <g class="an" data-tip="Fleet Telemetry — Disengagements, near-miss events, and sensor anomalies from production vehicles trigger replay-in-simulation and new scenario generation.">
            <rect x="34" y="510" width="910" height="34" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
            <text x="490" y="530" text-anchor="middle" font-size="9" font-weight="600" fill="#0891b2">Disengagements · Near-misses · Sensor anomalies to Scenario library growth (continuous improvement)</text>
          </g>
          <line x1="474" y1="180" x2="524" y2="180" stroke="#1d4ed8" stroke-width="1.5" opacity=".45" class="fl"/>
          <line x1="254" y1="280" x2="254" y2="298" stroke="#dc2626" stroke-width="1.4" opacity=".4" class="fl"/>
          <line x1="735" y1="280" x2="735" y2="298" stroke="#6d28d9" stroke-width="1.4" opacity=".4" class="fl"/>
          <line x1="490" y1="458" x2="490" y2="476" stroke="#0891b2" stroke-width="1.4" opacity=".4" class="fl"/>
        </svg>