<svg class="bp-svg" viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" font-family="DM Sans,sans-serif" font-size="11">
          <rect x="20" y="20" width="940" height="72" rx="12" fill="rgba(29,78,216,.05)" stroke="#1d4ed8" stroke-width="1.5"/>
          <text x="490" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">Edge &amp; DNS</text>
          <g class="an" data-tip="Route 53 — Global DNS with latency-based routing, health checks, and failover policies. Integrates with CloudFront and ALB for blue/green deployments and DR region switching.">
            <rect x="40" y="52" width="200" height="30" rx="6" fill="#eff4ff" stroke="#1d4ed8" stroke-width="1.2"/>
            <text x="140" y="71" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1d4ed8">Route 53 (DNS)</text>
          </g>
          <g class="an" data-tip="CloudFront — Global CDN with 400+ edge locations. Origin Shield reduces origin load. Signed URLs for protected content. Lambda@Edge for request/response manipulation at the edge.">
            <rect x="260" y="52" width="200" height="30" rx="6" fill="#eff4ff" stroke="#1d4ed8" stroke-width="1.2"/>
            <text x="360" y="71" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1d4ed8">CloudFront CDN</text>
          </g>
          <g class="an" data-tip="AWS WAF + Shield — Layer 7 protection with managed rule sets (OWASP Top 10, IP reputation). Shield Advanced provides DDoS protection with 24x7 DRT support.">
            <rect x="480" y="52" width="200" height="30" rx="6" fill="#eff4ff" stroke="#1d4ed8" stroke-width="1.2"/>
            <text x="580" y="71" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1d4ed8">WAF + Shield</text>
          </g>
          <g class="an" data-tip="API Gateway — REST and WebSocket APIs with request validation, throttling, and usage plans. Integrates with Lambda, Step Functions, and private VPC endpoints.">
            <rect x="700" y="52" width="240" height="30" rx="6" fill="#eff4ff" stroke="#1d4ed8" stroke-width="1.2"/>
            <text x="820" y="71" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1d4ed8">API Gateway</text>
          </g>
          <rect x="20" y="108" width="940" height="380" rx="14" fill="none" stroke="#6d28d9" stroke-width="1.8" stroke-dasharray="8 4" opacity=".55"/>
          <rect x="30" y="100" width="120" height="18" rx="4" fill="white"/>
          <text x="36" y="114" font-size="10.5" font-weight="700" fill="#6d28d9">VPC (Multi-AZ)</text>
          <rect x="40" y="130" width="910" height="72" rx="10" fill="rgba(8,145,178,.04)" stroke="#0891b2" stroke-width="1.2" stroke-dasharray="4 3"/>
          <text x="55" y="150" font-size="10" font-weight="700" fill="#0891b2">Public Subnet</text>
          <g class="an" data-tip="Application Load Balancer — Layer 7 load balancing with path-based and host-based routing, SSL termination (ACM certificates), and target groups per microservice.">
            <rect x="120" y="160" width="180" height="32" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
            <text x="210" y="180" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0891b2">Application LB</text>
          </g>
          <g class="an" data-tip="NAT Gateway — Enables outbound internet access from private subnets. Deployed per AZ for HA. Managed, auto-scaling.">
            <rect x="320" y="160" width="180" height="32" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
            <text x="410" y="180" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0891b2">NAT Gateway</text>
          </g>
          <g class="an" data-tip="SSM Session Manager — Replaces SSH bastion. Provides auditable, MFA-protected shell access to private EC2 instances without open SSH ports.">
            <rect x="520" y="160" width="180" height="32" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
            <text x="610" y="180" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0891b2">SSM / Bastion</text>
          </g>
          <g class="an" data-tip="Transit Gateway — Central hub for connecting multiple VPCs, on-prem (via VPN/Direct Connect), and cross-region peering.">
            <rect x="720" y="160" width="180" height="32" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
            <text x="810" y="180" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0891b2">Transit Gateway</text>
          </g>
          <rect x="40" y="214" width="610" height="148" rx="10" fill="rgba(22,163,74,.04)" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="4 3"/>
          <text x="55" y="234" font-size="10" font-weight="700" fill="#16a34a">Private Subnet — Compute</text>
          <g class="an" data-tip="EKS (Elastic Kubernetes Service) — Managed Kubernetes control plane with multi-AZ master nodes. Worker nodes via managed node groups or Fargate. IAM roles for service accounts (IRSA).">
            <rect x="55" y="244" width="170" height="54" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
            <text x="140" y="264" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">EKS Cluster</text>
            <text x="140" y="278" text-anchor="middle" font-size="8" fill="#7b7669">Managed K8s</text>
            <text x="140" y="290" text-anchor="middle" font-size="8" fill="#7b7669">HPA · Cluster AS</text>
          </g>
          <g class="an" data-tip="EC2 Auto Scaling Group — On-demand, Spot, or Reserved instances with ASG policies. Launch templates with AMI versioning.">
            <rect x="240" y="244" width="170" height="54" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
            <text x="325" y="264" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">EC2 Auto Scaling</text>
            <text x="325" y="278" text-anchor="middle" font-size="8" fill="#7b7669">Spot + On-Demand</text>
            <text x="325" y="290" text-anchor="middle" font-size="8" fill="#7b7669">Launch templates</text>
          </g>
          <g class="an" data-tip="Lambda — Serverless functions triggered by API Gateway, S3 events, SQS, EventBridge. Provisioned concurrency for predictable latency. VPC integration with ENIs.">
            <rect x="425" y="244" width="210" height="54" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
            <text x="530" y="264" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">Lambda (Serverless)</text>
            <text x="530" y="278" text-anchor="middle" font-size="8" fill="#7b7669">Event-driven</text>
            <text x="530" y="290" text-anchor="middle" font-size="8" fill="#7b7669">Provisioned concurrency</text>
          </g>
          <g class="an" data-tip="Fargate — Serverless compute for containers. Runs tasks without managing EC2 worker nodes. Pay per vCPU/memory per second.">
            <rect x="55" y="310" width="170" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
            <text x="140" y="327" text-anchor="middle" font-size="9.5" font-weight="700" fill="#16a34a">Fargate</text>
            <text x="140" y="340" text-anchor="middle" font-size="8" fill="#7b7669">Serverless containers</text>
          </g>
          <g class="an" data-tip="ECS — Container orchestration alternative to Kubernetes. Works with EC2 or Fargate launch types.">
            <rect x="240" y="310" width="170" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
            <text x="325" y="327" text-anchor="middle" font-size="9.5" font-weight="700" fill="#16a34a">ECS</text>
            <text x="325" y="340" text-anchor="middle" font-size="8" fill="#7b7669">Container orchestration</text>
          </g>
          <g class="an" data-tip="SageMaker — Managed ML platform with notebooks, training jobs, model registry, and endpoints. Integrates with S3 and ECR.">
            <rect x="425" y="310" width="210" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
            <text x="530" y="327" text-anchor="middle" font-size="9.5" font-weight="700" fill="#16a34a">SageMaker ML</text>
            <text x="530" y="340" text-anchor="middle" font-size="8" fill="#7b7669">Training · Inference</text>
          </g>
          <rect x="664" y="214" width="286" height="148" rx="10" fill="rgba(180,83,9,.04)" stroke="#b45309" stroke-width="1.3" stroke-dasharray="4 3"/>
          <text x="678" y="234" font-size="10" font-weight="700" fill="#b45309">Private Subnet — Data</text>
          <g class="an" data-tip="RDS Aurora — MySQL/PostgreSQL-compatible managed database. Multi-AZ with read replicas (up to 15). Auto-backup, point-in-time recovery, automated failover under 30s.">
            <rect x="678" y="244" width="258" height="38" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
            <text x="807" y="262" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">RDS Aurora (Multi-AZ)</text>
            <text x="807" y="274" text-anchor="middle" font-size="8" fill="#7b7669">Primary + Read replicas</text>
          </g>
          <g class="an" data-tip="DynamoDB — Serverless NoSQL with single-digit millisecond latency. On-demand or provisioned capacity. Global tables for multi-region active-active replication.">
            <rect x="678" y="290" width="124" height="38" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
            <text x="740" y="308" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">DynamoDB</text>
            <text x="740" y="320" text-anchor="middle" font-size="8" fill="#7b7669">NoSQL · Global</text>
          </g>
          <g class="an" data-tip="ElastiCache — Managed Redis/Memcached. Cluster mode for sharding; Multi-AZ for HA. Reduces RDS load by 60-80%.">
            <rect x="810" y="290" width="126" height="38" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
            <text x="873" y="308" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">ElastiCache</text>
            <text x="873" y="320" text-anchor="middle" font-size="8" fill="#7b7669">Redis · Memcached</text>
          </g>
          <g class="an" data-tip="OpenSearch — Managed Elasticsearch for log analytics, application search, and observability.">
            <rect x="678" y="334" width="258" height="24" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
            <text x="807" y="350" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">OpenSearch (Logs + Search)</text>
          </g>
          <rect x="40" y="378" width="910" height="94" rx="10" fill="rgba(8,145,178,.04)" stroke="#0891b2" stroke-width="1.2"/>
          <text x="490" y="398" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0891b2">Storage · Registry · Messaging</text>
          <g class="an" data-tip="S3 — Object storage with 11 nines durability. Lifecycle policies tier to IA, Glacier, Deep Archive. Versioning, replication, KMS encryption.">
            <rect x="55" y="410" width="160" height="52" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
            <text x="135" y="430" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0891b2">S3 Object Storage</text>
            <text x="135" y="444" text-anchor="middle" font-size="8" fill="#7b7669">Lifecycle · Versioning</text>
            <text x="135" y="456" text-anchor="middle" font-size="8" fill="#7b7669">Replication · KMS</text>
          </g>
          <g class="an" data-tip="ECR — Private container registry with image scanning (Amazon Inspector), lifecycle policies, and cross-region replication.">
            <rect x="230" y="410" width="150" height="52" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
            <text x="305" y="430" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0891b2">ECR</text>
            <text x="305" y="444" text-anchor="middle" font-size="8" fill="#7b7669">Container registry</text>
            <text x="305" y="456" text-anchor="middle" font-size="8" fill="#7b7669">Image scanning</text>
          </g>
          <g class="an" data-tip="SQS + SNS — SQS queues decouple services; SNS topics fan-out. FIFO queues for ordered processing. DLQ for poison messages.">
            <rect x="395" y="410" width="150" height="52" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
            <text x="470" y="430" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0891b2">SQS + SNS</text>
            <text x="470" y="444" text-anchor="middle" font-size="8" fill="#7b7669">Queues · Pub/Sub</text>
            <text x="470" y="456" text-anchor="middle" font-size="8" fill="#7b7669">FIFO · DLQ</text>
          </g>
          <g class="an" data-tip="EventBridge — Serverless event bus. Rules route events from AWS services and SaaS partners to Lambda, Step Functions, SQS.">
            <rect x="560" y="410" width="150" height="52" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
            <text x="635" y="430" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0891b2">EventBridge</text>
            <text x="635" y="444" text-anchor="middle" font-size="8" fill="#7b7669">Event bus</text>
            <text x="635" y="456" text-anchor="middle" font-size="8" fill="#7b7669">Schema registry</text>
          </g>
          <g class="an" data-tip="Kinesis — Real-time data streaming. Data Streams for custom processing, Data Firehose for direct S3/Redshift/OpenSearch delivery.">
            <rect x="725" y="410" width="210" height="52" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
            <text x="830" y="430" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0891b2">Kinesis Streams + Firehose</text>
            <text x="830" y="444" text-anchor="middle" font-size="8" fill="#7b7669">Real-time ingestion</text>
            <text x="830" y="456" text-anchor="middle" font-size="8" fill="#7b7669">S3 · OpenSearch delivery</text>
          </g>
          <rect x="40" y="488" width="910" height="112" rx="10" fill="rgba(109,40,217,.04)" stroke="#6d28d9" stroke-width="1.3"/>
          <text x="490" y="508" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6d28d9">Observability · Security · IAM</text>
          <g class="an" data-tip="CloudWatch — Metrics, logs, alarms, and dashboards. Log Insights for querying. Contributor Insights for top-N analysis. Anomaly detection via ML.">
            <rect x="55" y="520" width="140" height="66" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
            <text x="125" y="540" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">CloudWatch</text>
            <text x="125" y="554" text-anchor="middle" font-size="8" fill="#7b7669">Metrics · Logs</text>
            <text x="125" y="566" text-anchor="middle" font-size="8" fill="#7b7669">Alarms · Insights</text>
          </g>
          <g class="an" data-tip="X-Ray — Distributed tracing across services. Identifies bottlenecks and errors. Integrates with Lambda, API Gateway, EKS via OTel.">
            <rect x="210" y="520" width="120" height="66" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
            <text x="270" y="540" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">X-Ray</text>
            <text x="270" y="554" text-anchor="middle" font-size="8" fill="#7b7669">Distributed</text>
            <text x="270" y="566" text-anchor="middle" font-size="8" fill="#7b7669">tracing</text>
          </g>
          <g class="an" data-tip="GuardDuty — ML-based threat detection analyzing VPC Flow Logs, CloudTrail, and DNS logs. Detects compromised instances, cryptomining, exfiltration.">
            <rect x="345" y="520" width="140" height="66" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
            <text x="415" y="540" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">GuardDuty</text>
            <text x="415" y="554" text-anchor="middle" font-size="8" fill="#7b7669">Threat detection</text>
            <text x="415" y="566" text-anchor="middle" font-size="8" fill="#7b7669">VPC + CloudTrail</text>
          </g>
          <g class="an" data-tip="Security Hub + Config — Centralized security posture. AWS Config tracks resource changes; Security Hub aggregates findings from GuardDuty, Inspector, Macie.">
            <rect x="500" y="520" width="150" height="66" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
            <text x="575" y="540" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">Security Hub</text>
            <text x="575" y="554" text-anchor="middle" font-size="8" fill="#7b7669">+ AWS Config</text>
            <text x="575" y="566" text-anchor="middle" font-size="8" fill="#7b7669">Compliance posture</text>
          </g>
          <g class="an" data-tip="IAM + KMS — Fine-grained permissions via policies and roles. KMS for key management with rotation. Secrets Manager for DB credentials.">
            <rect x="665" y="520" width="140" height="66" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
            <text x="735" y="540" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">IAM + KMS</text>
            <text x="735" y="554" text-anchor="middle" font-size="8" fill="#7b7669">Roles · Policies</text>
            <text x="735" y="566" text-anchor="middle" font-size="8" fill="#7b7669">Key rotation</text>
          </g>
          <g class="an" data-tip="CloudTrail — API audit log for every AWS call. Organization-wide trail to central S3 bucket. Insights for anomaly detection. Required for SOC2 / ISO 27001.">
            <rect x="820" y="520" width="115" height="66" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
            <text x="877" y="540" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">CloudTrail</text>
            <text x="877" y="554" text-anchor="middle" font-size="8" fill="#7b7669">Audit log</text>
            <text x="877" y="566" text-anchor="middle" font-size="8" fill="#7b7669">Compliance</text>
          </g>
          <line x1="140" y1="82" x2="210" y2="160" stroke="#0891b2" stroke-width="1.3" opacity=".35" class="fl"/>
          <line x1="210" y1="192" x2="140" y2="244" stroke="#16a34a" stroke-width="1.3" opacity=".35" class="fl"/>
          <line x1="210" y1="192" x2="530" y2="244" stroke="#16a34a" stroke-width="1.3" opacity=".25" class="fl"/>
          <line x1="530" y1="298" x2="807" y2="262" stroke="#b45309" stroke-width="1.2" opacity=".25" class="fl"/>
        </svg>