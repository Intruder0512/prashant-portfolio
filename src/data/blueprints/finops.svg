<svg class="bp-svg" viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" font-family="DM Sans,sans-serif" font-size="11">
<defs><marker id="finblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="fincyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="fingreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="finamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="finviolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker><marker id="finred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="fingrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b7669"/></marker><marker id="finslate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<text x="30" y="28" text-anchor="start" font-size="11" font-weight="700" fill="#6d28d9">LANGGRAPH STATEGRAPH · ONE TYPED STATE · CHECKPOINTED</text>
<g class="an" data-tip="The question and an empty typed state enter the graph.">
<rect x="30" y="50" width="130" height="44" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
<text x="95.0" y="69.3" text-anchor="middle" font-size="9.5" font-weight="700" fill="#475569">START</text>
<text x="95.0" y="81.7" text-anchor="middle" font-size="8.2" fill="#7b7669">question + empty state</text>
</g>
<g class="an" data-tip="Supervisor — Gemini suggests the next worker as a structured Route; code rejects invalid or repeated choices and falls back to a fixed order. Once both the analyst and the anomaly detector have run (or 6 steps pass) it routes to the recommender without asking the model.">
<rect x="200" y="44" width="300" height="70" rx="8" fill="rgba(109,40,217,.07)" stroke="#6d28d9" stroke-width="1.4"/>
<text x="350.0" y="63.9" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">Supervisor</text>
<text x="350.0" y="76.3" text-anchor="middle" font-size="8.2" fill="#7b7669">Gemini picks next worker (structured Route)</text>
<text x="350.0" y="88.7" text-anchor="middle" font-size="8.2" fill="#7b7669">Code validates · fixed-order fallback</text>
<text x="350.0" y="101.1" text-anchor="middle" font-size="7.6" font-weight="600" fill="#6d28d9">Step cap 6 · both workers before recommender</text>
</g>
<path d="M160,72 L200,76" fill="none" stroke="#475569" stroke-width="1.6" opacity=".75" marker-end="url(#finslate)" class="fl"/>
<rect x="20" y="160" width="650" height="206" rx="12" fill="rgba(29,78,216,.07)" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="34" y="177" text-anchor="start" font-size="11" font-weight="700" fill="#1d4ed8">Workers</text>
<g class="an" data-tip="Analyst agent — Gemini with three billing tools bound (bind_tools); it calls tools until it can summarise, capped at 6 tool rounds. The loop is built by hand to show the mechanics.">
<rect x="40" y="186" width="200" height="70" rx="8" fill="rgba(29,78,216,.07)" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="140.0" y="205.9" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1d4ed8">Analyst agent</text>
<text x="140.0" y="218.3" text-anchor="middle" font-size="8.2" fill="#7b7669">Gemini with tools bound</text>
<text x="140.0" y="230.7" text-anchor="middle" font-size="8.2" fill="#7b7669">Loops until it can summarise</text>
<text x="140.0" y="243.1" text-anchor="middle" font-size="7.6" font-weight="600" fill="#1d4ed8">Max 6 tool rounds</text>
</g>
<g class="an" data-tip="ToolNode executes the tool calls against pandas: total_cost, daily_trend and cost_between. Every figure comes from code; the model only chooses tools and explains.">
<rect x="40" y="296" width="200" height="56" rx="8" fill="rgba(8,145,178,.07)" stroke="#0891b2" stroke-width="1.4"/>
<text x="140.0" y="321.3" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0891b2">ToolNode · pandas tools</text>
<text x="140.0" y="333.7" text-anchor="middle" font-size="8.2" fill="#7b7669">total_cost · daily_trend · cost_between</text>
</g>
<path d="M110,256 L110,296" fill="none" stroke="#1d4ed8" stroke-width="1.6" opacity=".75" marker-end="url(#finblue)" class="fl"/>
<text x="90" y="280" text-anchor="middle" font-size="8" font-weight="600" fill="#1d4ed8">calls</text>
<path d="M170,296 L170,256" fill="none" stroke="#0891b2" stroke-width="1.6" opacity=".75" marker-end="url(#fincyan)" class="fl"/>
<text x="196" y="280" text-anchor="middle" font-size="8" font-weight="600" fill="#0891b2">results</text>
<g class="an" data-tip="analyst_collect stores the analyst’s summary in findings and marks the analyst visited, so the supervisor knows it has run.">
<rect x="270" y="186" width="190" height="70" rx="8" fill="rgba(29,78,216,.07)" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="365.0" y="212.1" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1d4ed8">analyst_collect</text>
<text x="365.0" y="224.5" text-anchor="middle" font-size="8.2" fill="#7b7669">Stores the summary as a finding</text>
<text x="365.0" y="236.9" text-anchor="middle" font-size="8.2" fill="#7b7669">Marks analyst as visited</text>
</g>
<path d="M240,221 L270,221" fill="none" stroke="#1d4ed8" stroke-width="1.6" opacity=".75" marker-end="url(#finblue)" class="fl"/>
<g class="an" data-tip="Anomaly detector — deterministic rules, no LLM. Spikes are days above twice the trailing 7-day median and over ₹100; idle spend is ≥ ₹100 a day with usage under 10% of earlier levels. Rules are repeatable and explainable to finance.">
<rect x="490" y="186" width="160" height="110" rx="8" fill="rgba(22,163,74,.07)" stroke="#16a34a" stroke-width="1.4"/>
<text x="570.0" y="213.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#16a34a">Anomaly detector</text>
<text x="570.0" y="225.9" text-anchor="middle" font-size="8.2" fill="#7b7669">No LLM — rules only</text>
<text x="570.0" y="238.3" text-anchor="middle" font-size="8.2" fill="#7b7669">Spike: &gt; 2× trailing</text>
<text x="570.0" y="250.7" text-anchor="middle" font-size="8.2" fill="#7b7669">7-day median, &gt; ₹100</text>
<text x="570.0" y="263.1" text-anchor="middle" font-size="8.2" fill="#7b7669">Idle: usage &lt; 10%</text>
<text x="570.0" y="275.5" text-anchor="middle" font-size="7.6" font-weight="600" fill="#16a34a">of earlier average</text>
</g>
<g class="an" data-tip="The key design choice: the LLM never calculates costs and never has the final say on routing — code does both, which keeps the run auditable.">
<rect x="270" y="306" width="380" height="48" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
<text x="460.0" y="327.3" text-anchor="middle" font-size="9.5" font-weight="700" fill="#475569">Code beats the model</text>
<text x="460.0" y="339.7" text-anchor="middle" font-size="8.2" fill="#7b7669">Every number from pandas · routing validated in code</text>
</g>
<path d="M250,114 L250,140 L140,140 L140,186" fill="none" stroke="#6d28d9" stroke-width="1.6" opacity=".75" marker-end="url(#finviolet)" class="fl"/>
<text x="196" y="134" text-anchor="middle" font-size="8" font-weight="600" fill="#6d28d9">route</text>
<path d="M450,114 L450,140 L570,140 L570,186" fill="none" stroke="#6d28d9" stroke-width="1.6" opacity=".75" marker-end="url(#finviolet)" class="fl"/>
<text x="510" y="134" text-anchor="middle" font-size="8" font-weight="600" fill="#6d28d9">route</text>
<path d="M365,186 L365,114" fill="none" stroke="#1d4ed8" stroke-width="1.6" opacity=".75" marker-end="url(#finblue)" class="fl"/>
<text x="405" y="152" text-anchor="middle" font-size="8" font-weight="600" fill="#1d4ed8">report back</text>
<path d="M630,186 L630,86 L500,86" fill="none" stroke="#16a34a" stroke-width="1.6" opacity=".75" marker-end="url(#fingreen)" class="fl"/>
<text x="600" y="100" text-anchor="middle" font-size="8" font-weight="600" fill="#16a34a">report back</text>
<g class="an" data-tip="Recommender — Gemini returns a Pydantic-validated RecommendationList (service, action, estimated monthly saving in INR, risk). If the call or validation fails, a rule-based fallback builds recommendations from the anomalies.">
<rect x="700" y="44" width="260" height="70" rx="8" fill="rgba(180,83,9,.07)" stroke="#b45309" stroke-width="1.4"/>
<text x="830.0" y="63.9" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">Recommender</text>
<text x="830.0" y="76.3" text-anchor="middle" font-size="8.2" fill="#7b7669">Gemini → Pydantic RecommendationList</text>
<text x="830.0" y="88.7" text-anchor="middle" font-size="8.2" fill="#7b7669">Saving ≥ 0 · risk low / medium / high</text>
<text x="830.0" y="101.1" text-anchor="middle" font-size="7.6" font-weight="600" fill="#b45309">Rule-based fallback on failure</text>
</g>
<path d="M500,58 L700,58" fill="none" stroke="#6d28d9" stroke-width="1.6" opacity=".75" marker-end="url(#finviolet)" class="fl"/>
<text x="600" y="52" text-anchor="middle" font-size="8" font-weight="600" fill="#6d28d9">both workers done</text>
<g class="an" data-tip="Approval gate — interrupt() pauses the run and the checkpointer saves state under the thread_id. The CLI shows the recommendations and resumes with Command(resume=answer); only an explicit yes approves.">
<rect x="700" y="160" width="260" height="70" rx="8" fill="rgba(220,38,38,.07)" stroke="#dc2626" stroke-width="1.4"/>
<text x="830.0" y="179.9" text-anchor="middle" font-size="9.5" font-weight="700" fill="#dc2626">Approval gate · interrupt()</text>
<text x="830.0" y="192.3" text-anchor="middle" font-size="8.2" fill="#7b7669">Pauses the graph; state checkpointed</text>
<text x="830.0" y="204.7" text-anchor="middle" font-size="8.2" fill="#7b7669">Resume with Command(resume=answer)</text>
<text x="830.0" y="217.1" text-anchor="middle" font-size="7.6" font-weight="600" fill="#dc2626">Only an explicit yes approves</text>
</g>
<path d="M830,114 L830,160" fill="none" stroke="#b45309" stroke-width="1.6" opacity=".75" marker-end="url(#finamber)" class="fl"/>
<g class="an" data-tip="Script writer — Gemini drafts a cleanup script; sanitize_script keeps only comments and gcloud lines and adds a DRAFT banner. Nothing is executed by the agent.">
<rect x="700" y="280" width="260" height="70" rx="8" fill="rgba(22,163,74,.07)" stroke="#16a34a" stroke-width="1.4"/>
<text x="830.0" y="299.9" text-anchor="middle" font-size="9.5" font-weight="700" fill="#16a34a">Script writer</text>
<text x="830.0" y="312.3" text-anchor="middle" font-size="8.2" fill="#7b7669">Drafts a gcloud cleanup script</text>
<text x="830.0" y="324.7" text-anchor="middle" font-size="8.2" fill="#7b7669">Allow-list filter · DRAFT banner</text>
<text x="830.0" y="337.1" text-anchor="middle" font-size="7.6" font-weight="600" fill="#16a34a">Never executed by the agent</text>
</g>
<path d="M800,230 L800,280" fill="none" stroke="#16a34a" stroke-width="1.6" opacity=".75" marker-end="url(#fingreen)" class="fl"/>
<text x="786" y="260" text-anchor="middle" font-size="8" font-weight="600" fill="#16a34a">yes</text>
<g class="an" data-tip="The run ends with a draft script after approval, or with no script after a no.">
<rect x="700" y="390" width="260" height="44" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
<text x="830.0" y="409.3" text-anchor="middle" font-size="9.5" font-weight="700" fill="#475569">END</text>
<text x="830.0" y="421.7" text-anchor="middle" font-size="8.2" fill="#7b7669">Draft script, or no action</text>
</g>
<path d="M830,350 L830,390" fill="none" stroke="#16a34a" stroke-width="1.6" opacity=".75" marker-end="url(#fingreen)" class="fl"/>
<path d="M960,195 L972,195 L972,412 L960,412" fill="none" stroke="#dc2626" stroke-width="1.6" opacity=".75" marker-end="url(#finred)" class="fl"/>
<text x="962" y="306" text-anchor="middle" font-size="8" font-weight="600" fill="#dc2626">no</text>
<rect x="20" y="390" width="650" height="130" rx="12" fill="rgba(109,40,217,.07)" stroke="#6d28d9" stroke-width="1.5"/>
<text x="34" y="407" text-anchor="start" font-size="11" font-weight="700" fill="#6d28d9">Shared state (TypedDict) — workers append, never overwrite</text>
<g class="an" data-tip="State field messages — add_messages reducer. One typed state travels through every node, so any run is easy to inspect and replay.">
<rect x="34" y="418" width="200" height="40" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="134.0" y="435.3" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">messages</text>
<text x="134.0" y="447.7" text-anchor="middle" font-size="8.2" fill="#7b7669">add_messages reducer</text>
</g>
<g class="an" data-tip="State field findings · visited — operator.add reducers. One typed state travels through every node, so any run is easy to inspect and replay.">
<rect x="246" y="418" width="200" height="40" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="346.0" y="435.3" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">findings · visited</text>
<text x="346.0" y="447.7" text-anchor="middle" font-size="8.2" fill="#7b7669">operator.add reducers</text>
</g>
<g class="an" data-tip="State field anomalies — structured list. One typed state travels through every node, so any run is easy to inspect and replay.">
<rect x="458" y="418" width="200" height="40" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="558.0" y="435.3" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">anomalies</text>
<text x="558.0" y="447.7" text-anchor="middle" font-size="8.2" fill="#7b7669">structured list</text>
</g>
<g class="an" data-tip="State field recommendations — validated actions. One typed state travels through every node, so any run is easy to inspect and replay.">
<rect x="34" y="466" width="200" height="40" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="134.0" y="483.3" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">recommendations</text>
<text x="134.0" y="495.7" text-anchor="middle" font-size="8.2" fill="#7b7669">validated actions</text>
</g>
<g class="an" data-tip="State field steps · next_worker — routing control. One typed state travels through every node, so any run is easy to inspect and replay.">
<rect x="246" y="466" width="200" height="40" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="346.0" y="483.3" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">steps · next_worker</text>
<text x="346.0" y="495.7" text-anchor="middle" font-size="8.2" fill="#7b7669">routing control</text>
</g>
<g class="an" data-tip="State field approved · cleanup_script — gate outcome. One typed state travels through every node, so any run is easy to inspect and replay.">
<rect x="458" y="466" width="200" height="40" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="558.0" y="483.3" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d28d9">approved · cleanup_script</text>
<text x="558.0" y="495.7" text-anchor="middle" font-size="8.2" fill="#7b7669">gate outcome</text>
</g>
<rect x="20" y="540" width="178" height="42" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1"/>
<text x="109.0" y="558" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">Validated routing</text>
<text x="109.0" y="572" text-anchor="middle" font-size="8" fill="#7b7669">LLM suggests, code decides</text>
<rect x="210" y="540" width="178" height="42" rx="8" fill="#eff4ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="299.0" y="558" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">6 / 6</text>
<text x="299.0" y="572" text-anchor="middle" font-size="8" fill="#7b7669">step cap · tool-round cap</text>
<rect x="400" y="540" width="178" height="42" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
<text x="489.0" y="558" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">pandas</text>
<text x="489.0" y="572" text-anchor="middle" font-size="8" fill="#7b7669">all cost figures</text>
<rect x="590" y="540" width="178" height="42" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="679.0" y="558" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">interrupt()</text>
<text x="679.0" y="572" text-anchor="middle" font-size="8" fill="#7b7669">human approval</text>
<rect x="780" y="540" width="178" height="42" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1"/>
<text x="869.0" y="558" text-anchor="middle" font-size="11" font-weight="700" fill="#0891b2">13 tests</text>
<text x="869.0" y="572" text-anchor="middle" font-size="8" fill="#7b7669">offline · fake LLM</text>
<text x="20" y="610" text-anchor="start" font-size="9" font-weight="500" fill="#7b7669">Proof of concept on synthetic billing data (30 days, INR). Production path: BigQuery billing export, durable checkpointer, Cloud Run.</text>
</svg>
